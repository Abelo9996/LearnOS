# Minimal Judge0 configuration for the docker-compose stack. These are the
# connection settings the Judge0 server, workers and Postgres all read. For the
# full set of tunables (limits, enabled languages, etc.) see Judge0's own
# judge0.conf at https://github.com/judge0/judge0.

# Postgres (the hostname must match the judge0-db service name)
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0pass

# Redis (the hostname must match the judge0-redis service name, and the password
# must match the --requirepass value in docker-compose.yml)
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0redis

# Keep submissions bounded.
MAX_CPU_TIME_LIMIT=15
MAX_WALL_TIME_LIMIT=30
MAX_MEMORY_LIMIT=256000
