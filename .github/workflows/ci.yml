name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Boot smoke test
        env:
          LEARNOS_JWT_SECRET: test-secret-for-ci-only-not-real
          NODE_ENV: development
          PORT: 3999
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 3
          curl -fsS http://localhost:3999/api/health
          kill $SERVER_PID
